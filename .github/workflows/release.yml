name: Release

# Dispara build + publicação na Play Store e no GitHub Releases a cada push na branch main.
# Pré-requisitos (ver README.md > "Configurar o CI/CD"): keystore de assinatura,
# service account do Google Play e a variável de repositório PLAY_STORE_PUBLISHING_ENABLED.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rodar testes unitários
        run: ./gradlew test --console=plain

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    # Só publica de fato quando o repositório tiver os segredos configurados e essa
    # variável (Settings > Secrets and variables > Actions > Variables) for "true".
    if: ${{ vars.PLAY_STORE_PUBLISHING_ENABLED == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decodificar keystore de assinatura
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > "${{ runner.temp }}/release.keystore"

      - name: Gerar APK e Android App Bundle assinados
        env:
          CI_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          CI_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --console=plain

      - name: Remover keystore temporário
        if: always()
        run: rm -f "${{ runner.temp }}/release.keystore"

      - name: Publicar na Play Store (faixa interna)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.calculadoraclt.app
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - name: Publicar no GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
